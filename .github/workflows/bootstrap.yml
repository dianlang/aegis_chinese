name: Bulk initial Chinese card database bootstrap
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
permissions:
  contents: write
concurrency:
  group: digicamoe-sync
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 119
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check bootstrap configuration
        id: config
        run: |
          echo "enabled=$(python -c 'import json; print(str(json.load(open("data/bootstrap.json"))["enabled"]).lower())')" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        if: steps.config.outputs.enabled == 'true'
        run: python -m unittest discover -s tests -v
      - name: Discover real card URLs from package pages (one request per >=6s)
        id: discovery
        continue-on-error: true
        if: steps.config.outputs.enabled == 'true'
        run: python tools/index_packages.py --limit 175 --delay 1 --time-budget-seconds 180
      - name: Collect all indexed card texts (<=1 HTTP request started per second)
        id: collect
        continue-on-error: true
        if: steps.config.outputs.enabled == 'true' && steps.discovery.outcome == 'success'
        run: python tools/fast_bootstrap.py --max-cards 6000 --workers 4 --min-interval 1 --time-budget-minutes 110 --mode all
      - name: Switch to daily maintenance when indexed coverage is sufficient
        if: steps.config.outputs.enabled == 'true' && steps.collect.outcome == 'success'
        run: python tools/check_bootstrap.py
      - name: Validate records
        id: validate
        if: always() && steps.config.outputs.enabled == 'true'
        run: python tools/validate_database.py
      - name: Report upstream interruption
        if: steps.config.outputs.enabled == 'true' && (steps.discovery.outcome == 'failure' || steps.collect.outcome == 'failure')
        run: echo "::warning::Bulk sync stopped early due to upstream/network error. Valid checkpoints will still be committed."
      - name: Commit progress
        if: always() && steps.config.outputs.enabled == 'true' && steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "data: bulk bootstrap DigiCamoe card index and Chinese card texts"
          git push
