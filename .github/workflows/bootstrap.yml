name: Bulk initial Chinese card database bootstrap
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: digicamoe-sync
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 119
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check bootstrap configuration
        id: config
        run: |
          echo "enabled=$(python -c 'import json; print(str(json.load(open("data/bootstrap.json"))["enabled"]).lower())')" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        if: steps.config.outputs.enabled == 'true'
        run: python -m unittest discover -s tests -v
      - name: Discover missing card packages with resumable index scan
        id: discovery
        continue-on-error: true
        if: steps.config.outputs.enabled == 'true'
        run: python tools/index_packages.py --limit 175 --delay 1 --time-budget-seconds 180
      - name: Collect all indexed card texts (<=1 HTTP request started per second)
        id: collect
        continue-on-error: true
        if: steps.config.outputs.enabled == 'true' && steps.discovery.outcome == 'success'
        run: python tools/fast_bootstrap.py --max-cards 6000 --workers 4 --min-interval 1 --time-budget-minutes 110 --mode all
      - name: Switch to daily maintenance when indexed coverage is sufficient
        if: steps.config.outputs.enabled == 'true' && steps.collect.outcome == 'success'
        run: python tools/check_bootstrap.py
      - name: Validate records
        id: validate
        if: always() && steps.config.outputs.enabled == 'true'
        run: python tools/validate_database.py
      - name: Report upstream interruption
        if: steps.config.outputs.enabled == 'true' && (steps.discovery.outcome == 'failure' || steps.collect.outcome == 'failure')
        run: echo "::warning::Bulk sync stopped early due to upstream/network error. Valid checkpoints will still be committed."
      - name: Back up harvested data even if the source interrupts
        if: always() && steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digicamoe-harvested-data
          path: data/
          retention-days: 7
          if-no-files-found: error
      - name: Merge latest remote data then safely publish
        if: always() && steps.config.outputs.enabled == 'true' && steps.validate.outcome == 'success'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          checkpoint="$(mktemp -d)"
          cp -a data "$checkpoint/data"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python tools/merge_collected.py "$checkpoint/data"
            python tools/validate_database.py
            git add -A data
            if git diff --cached --quiet; then
              echo "No new data to publish."
              exit 0
            fi
            git commit -m "data: safe incremental DigiCamoe card checkpoint"
            if git push origin HEAD:main; then
              echo "Committed data checkpoint successfully."
              exit 0
            fi
            echo "::warning::Main changed before push; re-merging JSON attempt \${attempt}/4"
            sleep 4
          done
          echo "::error::Unable to publish checkpoint; download the backup artifact."
          exit 1
