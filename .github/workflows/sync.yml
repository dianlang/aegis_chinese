name: Daily 20-card maintenance (after bootstrap)
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Maximum cards to check this run (one request every >=6s)"
        type: choice
        required: true
        default: '20'
        options: ['20', '40', '60', '100']
      mode:
        description: "all: missing then refresh; new: missing only; enrich: complete old records"
        type: choice
        required: true
        default: all
        options: [all, new, enrich]
  schedule:
    - cron: '20 4 * * *'
permissions:
  contents: write
concurrency:
  group: digicamoe-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check bulk bootstrap status
        id: phase
        run: |
          echo "bootstrap=$(python -c 'import json; print(str(json.load(open("data/bootstrap.json"))["enabled"]).lower())')" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r requirements.txt
        if: github.event_name == 'workflow_dispatch' || steps.phase.outputs.bootstrap == 'false'
      - name: Offline parser regression tests
        if: github.event_name == 'workflow_dispatch' || steps.phase.outputs.bootstrap == 'false'
        run: python -m unittest discover -s tests -v
      - name: Discover newly published packages for daily maintenance
        if: github.event_name == 'workflow_dispatch' || steps.phase.outputs.bootstrap == 'false'
        run: python tools/index_packages.py --limit 10 --delay 6
      - name: Incremental sync (single-threaded; rate limited)
        if: github.event_name == 'workflow_dispatch' || steps.phase.outputs.bootstrap == 'false'
        env:
          CARD_LIMIT: ${{ inputs.count || '20' }}
          CARD_MODE: ${{ inputs.mode || 'all' }}
        run: python tools/sync_cards.py --limit "$CARD_LIMIT" --mode "$CARD_MODE" --delay 6 --time-budget-minutes 25
      - name: Validate JSON
        if: github.event_name == 'workflow_dispatch' || steps.phase.outputs.bootstrap == 'false'
        run: python tools/validate_database.py
      - name: Save daily card checkpoint
        if: github.event_name == 'workflow_dispatch' || steps.phase.outputs.bootstrap == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: digicamoe-daily-checkpoint
          path: data/
          retention-days: 7
      - name: Merge card JSON with latest main and publish
        if: github.event_name == 'workflow_dispatch' || steps.phase.outputs.bootstrap == 'false'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          checkpoint="$(mktemp -d)"
          cp -a data "$checkpoint/data"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python tools/merge_collected.py "$checkpoint/data"
            python tools/validate_database.py
            git add -A data
            if git diff --cached --quiet; then
              echo "No new card records."
              exit 0
            fi
            git commit -m "data: daily DigiCamoe Chinese cards"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Concurrent changes detected; merging again."
            sleep 4
          done
          echo "::error::Remote push retries failed; download the checkpoint artifact."
          exit 1
