name: Weekly Chinese card text sync
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Maximum cards to check this run (one request every >=6s)"
        type: choice
        required: true
        default: '40'
        options: ['20', '40', '60']
      mode:
        description: "all: missing then refresh; new: missing only; enrich: complete old records"
        type: choice
        required: true
        default: all
        options: [all, new, enrich]
  schedule:
    - cron: '20 4 * * *'
permissions:
  contents: write
concurrency:
  group: digicamoe-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Offline parser regression tests
        run: python -m unittest discover -s tests -v
      - name: Incremental sync (single-threaded; rate limited)
        env:
          CARD_LIMIT: ${{ inputs.count || '40' }}
          CARD_MODE: ${{ inputs.mode || 'all' }}
        run: python tools/sync_cards.py --limit "$CARD_LIMIT" --mode "$CARD_MODE" --delay 6
      - name: Validate JSON
        run: python tools/validate_database.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards data/manifest.json data/sync-state.json
          git diff --cached --quiet && exit 0
          git commit -m "data: incremental DigiCamoe Chinese cards"
          git push
