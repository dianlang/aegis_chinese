name: Official CN card numbers full alignment (IDs only)
on:
  push:
    paths:
      - "tools/export_official_ids.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-cn-card-mapping
  cancel-in-progress: false
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install existing database dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch official CN card pages carefully (local only, resumable within runner)
        id: fetch
        continue-on-error: true
        run: python -u tools/sync_official_cn.py --full --interval 4 --time-budget-minutes 25
      - name: Export only printed card IDs, CN pack codes and Aegis links
        run: python -u tools/export_official_ids.py
      - name: Validate existing Chinese card database
        run: python tools/validate_database.py
      - name: Back up ID-only mapping
        uses: actions/upload-artifact@v4
        with:
          name: official-cn-ids-only
          path: data/mapping/official_cn_ids.json
          retention-days: 7
      - name: Publish ID-only mapping without official card texts
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mapping/official_cn_ids.json
          if git diff --cached --quiet; then
            echo "No updated official card identifiers."
            exit 0
          fi
          git commit -m "data: verified official CN card IDs and exact Aegis/JP mapping"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Report API interruption
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning::Official CN API returned an error; mapped partial records were still saved as IDs only. Wait before trying again."
