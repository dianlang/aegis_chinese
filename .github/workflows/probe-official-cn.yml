name: One-time public CN frontend API probe
on:
  push:
    paths:
      - "tools/probe_official_http.py"
      - "tools/probe_cardlist_chunk.py"
      - "tools/probe_official_api_module.py"
      - "tools/official_cn_api_sample.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Inspect public official cardlist frontend only
        run: python -u tools/official_cn_api_sample.py
