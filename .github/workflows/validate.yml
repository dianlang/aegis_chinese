name: Validate Chinese database
on:
  push:
    paths: ["data/**", "tools/**", "tests/**", ".github/workflows/validate.yml", "requirements.txt"]
  pull_request:
    paths: ["data/**", "tools/**", ".github/workflows/validate.yml", "requirements.txt"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate_database.py
      - run: python -m unittest discover -s tests -v
